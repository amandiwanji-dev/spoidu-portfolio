<!doctype html><html><head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=block">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#090909;color:#F5F5F5;font-family:'Space Grotesk',sans-serif;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(#1a1a1a 1px,transparent 1px),linear-gradient(90deg,#1a1a1a 1px,transparent 1px);background-size:80px 80px;opacity:.6}
.top{position:absolute;top:56px;left:64px;right:64px;display:flex;justify-content:space-between;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#A1A1A1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#C5FF4A;margin-right:12px}
.mark{position:absolute;left:58px;top:150px;font-size:250px;font-weight:700;letter-spacing:-.06em;line-height:.85}
.mark sup{font-size:60px;font-weight:500;vertical-align:top;position:relative;top:22px;letter-spacing:0;margin-left:6px}
.line{position:absolute;left:64px;top:410px;font-size:44px;font-weight:700;text-transform:uppercase;letter-spacing:-.03em}
.line span{color:#C5FF4A}
.bottom{position:absolute;bottom:56px;left:64px;right:64px;display:flex;justify-content:space-between;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#A1A1A1;border-top:1px solid #292929;padding-top:22px}
</style></head><body>
<div class="grid"></div>
<div class="top"><span><i class="dot"></i>Video Editor | Motion Designer | AI Video Creator</span><span>India</span></div>
<div class="mark">SpoidU<sup>®</sup></div>
<div class="line">I make videos <span>move</span> people.</div>
<div class="bottom"><span>Editing • Motion design • Visual storytelling</span><span>Portfolio</span></div>
</body></html>
